[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-assistant"
version = "0.1.0"
description = "User-facing orchestration service for FRIDAY."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "uvicorn[standard]>=0.29",
    "friday-brain-client>=0.1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
friday-assistant = "friday_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["friday_assistant"]
mypy_path = "src"
